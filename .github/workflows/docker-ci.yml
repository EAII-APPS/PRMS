name: Build & Push Docker Images

on:
  push:
    branches:
      - main
      - ci-cd-setup

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        run: |
          docker build \
            -t ghcr.io/eaii-apps/prms-backend:latest \
            ./backend
          docker push ghcr.io/eaii-apps/prms-backend:latest

      - name: Build & push frontend image
        run: |
          docker build \
            -t ghcr.io/eaii-apps/prms-frontend:latest \
            ./frontend
          docker push ghcr.io/eaii-apps/prms-frontend:latest

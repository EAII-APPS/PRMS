name: CI/CD Build & Deploy

on:
  push:
    branches:
      - ci-cd-clean
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set image tags
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          DATE_TAG=$(date +'%Y%m%d-%H%M')
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV

      - name: Build backend image
        run: |
          docker build -t ghcr.io/eaii-apps/prms-backend:latest \
                       -t ghcr.io/eaii-apps/prms-backend:$COMMIT_SHA \
                       -t ghcr.io/eaii-apps/prms-backend:$DATE_TAG \
                       ./backend

      - name: Push backend image
        run: |
          docker push ghcr.io/eaii-apps/prms-backend:latest
          docker push ghcr.io/eaii-apps/prms-backend:$COMMIT_SHA
          docker push ghcr.io/eaii-apps/prms-backend:$DATE_TAG

      - name: Build frontend image
        run: |
          docker build -t ghcr.io/eaii-apps/prms-frontend:latest \
                       -t ghcr.io/eaii-apps/prms-frontend:$COMMIT_SHA \
                       -t ghcr.io/eaii-apps/prms-frontend:$DATE_TAG \
                       ./frontend

      - name: Push frontend image
        run: |
          docker push ghcr.io/eaii-apps/prms-frontend:latest
          docker push ghcr.io/eaii-apps/prms-frontend:$COMMIT_SHA
          docker push ghcr.io/eaii-apps/prms-frontend:$DATE_TAG

      - name: Start CI/CD containers
        run: docker compose -f docker-compose.cicd.yml up -d

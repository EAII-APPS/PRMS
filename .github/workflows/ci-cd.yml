name: CI/CD Build & Deploy

on:
  push:
    branches:
      - ci-cd-clean
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # Step 3: Build backend image
      - name: Build backend Docker image
        run: |
          docker build -t ghcr.io/eaii-apps/prms-backend:latest ./backend

      # Step 4: Push backend image to GHCR
      - name: Push backend Docker image
        run: |
          docker push ghcr.io/eaii-apps/prms-backend:latest

      # Step 5: Build frontend image
      - name: Build frontend Docker image
        run: |
          docker build -t ghcr.io/eaii-apps/prms-frontend:latest ./frontend

      # Step 6: Push frontend image to GHCR
      - name: Push frontend Docker image
        run: |
          docker push ghcr.io/eaii-apps/prms-frontend:latest

      # Step 7: Pull and start CI/CD containers locally
      - name: Start CI/CD containers
        run: |
          docker compose -f docker-compose.cicd.yml up -d
